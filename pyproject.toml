[project]
name = "bbochat"
version = "0.0.4"
description = "Chat manager for BBO"
authors = [{name = "Jeff Watkins", email = "jeffwatkins2000@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "bidict>=0.23.1",
    "clipboard>=0.0.4",
    "emoji>=2.15.0",
    "psiutils>=1.0.2",
    "python-dateutil>=2.9.0.post0",
    "tkhtmlview>=0.3.2",
    "userpaths>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"