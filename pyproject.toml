[project]
name = "bbochat"
version = "0.0.5"
description = "Chat manager for BBO"
authors = [
    { name = "Jeff Watkins", email = "jeffwatkins2000@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bidict>=0.23.1",
    "clipboard>=0.0.4",
    "dotenv>=0.9.9",
    "emoji>=2.15.0",
    "platformdirs>=4.11.7",
    "psiutils>=1.0.8",
    "python-dateutil>=2.9.0.post0",
    "tkhtmlview>=0.3.2",
    "userpaths>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true

[tool.uv.sources]
psiutils = { path = "../psi-utilities/psiutils", editable = true }

[build-system]
requires = [
    "uv-build",
]
build-backend = "uv_build"
