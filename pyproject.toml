[project]
name = "bbochat"
version = "0.1.0"
description = "Chat manager for BBO"
authors = [{name = "Jeff", "email" = "<jeffwatkins2000@gmail.com>"}]
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    "appdirs>=1.4.4",
    "clipboard>=0.0.4",
    "emoji>=2.14.1",
    "icecream>=2.1.4",
    "markdown>=3.8",
    "psi-toml>=0.0.18",
    "psiconfig>=0.0.15",
    "psiutils>=0.2.10",
    "pygobject>=3.54.2",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.4.0",
    "tkinterweb>=4.3.1",
    "userpaths>=0.1.3",
]

[dependency-groups]
dev = ['pytest']

[build-system]
requires = ['uv-build']
build-backend = 'uv_build'
